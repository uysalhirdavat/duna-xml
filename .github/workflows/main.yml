name: Duna XML Otomatik Guncelleme

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */5 * * *"

permissions:
  contents: write

concurrency:
  group: duna-xml-update
  cancel-in-progress: false

jobs:
  update-duna-xml:
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: Depoyu al
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Kutuphaneleri kur
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml deep-translator

      - name: Duna XML dosyasini guncelle
        env:
          DUNA_USERNAME: ${{ secrets.DUNA_USERNAME }}
          DUNA_PASSWORD: ${{ secrets.DUNA_PASSWORD }}
        run: python duna_update.py

      - name: Degisiklikleri kaydet
        run: |
          git config user.name "duna-xml-bot"
          git config user.email "actions@github.com"
          git add duna.xml translations.json
          git diff --cached --quiet || git commit -m "Duna XML ve ceviri onbellegi guncelleme"
          git pull --rebase origin main
          git push
