name: Duna XML Otomatik Guncelleme

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  update-duna-xml:
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu al
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Kutuphaneleri kur
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml

      - name: Duna XML dosyasini guncelle
        run: python duna_update.py

      - name: Degisiklikleri kaydet
        run: |
          git config user.name "duna-xml-bot"
          git config user.email "actions@github.com"
          git add duna.xml
          git diff --cached --quiet || git commit -m "Duna XML otomatik guncelleme"
          git push
